[project]
name = "diffusion"
version = "0.1.0"
description = "Diffusion in Pytorch From Scratch"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pillow>=12.0.0",
    "tensorboardx>=2.6.4",
    "torch>=2.9.0",
    "torchvision>=0.24.0",
]


[tools.ruff]
lint.select = ["E", "F", "W"]
line-length = 80

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
